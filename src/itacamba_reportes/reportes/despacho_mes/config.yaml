# ─────────────────────────────────────────────────────────────────────
# Pipeline DESPACHO MES — int_despacho_bi -> agregado mensual
# ─────────────────────────────────────────────────────────────────────
# Equivalente a la hoja DESPACHO_MES del basepanel.xlsm.

name: despacho_mes
description: |
  Agrega int_despacho_bi por gerencia/equipo/depto/localidad/CD/producto/
  incoterms/fecha/cliente sumando despacho_t. Luego aplica 4 VLOOKUP
  vivos (nombre_cliente, vendedor, tipo_venta, canal, semana2) y dos
  reglas de cleanup heredadas de VBA.

source_table: int_despacho_bi
int_table:    int_despacho_mes

# ─────────────────────────────────────────────────────────────────────
# MES OBJETIVO (filtra int_despacho_bi antes de agregar)
# ─────────────────────────────────────────────────────────────────────
# Valores aceptados:
#   "auto"               -> ULTIMO mes con datos (recomendado, op. recurrente)
#   "current"            -> mes y año actuales (legacy)
#   {anio: 2026, mes: 5} -> forzado (reproceso historico)
#   null                 -> todo el historico de int_despacho_bi
#
# Fallback: si el target deja 0 filas, cae al ultimo mes con datos y
# loguea WARNING (en vez de tirar pipeline vacio en silencio).
mes_objetivo: auto

# ─────────────────────────────────────────────────────────────────────
# AGREGACION (GROUP BY + SUM)
# ─────────────────────────────────────────────────────────────────────
group_by:
  - gerencia
  - equipo
  - departamento
  - localidad_im        # se renombra a 'localidad' tras agregar
  - centro_distribucion
  - producto
  - incoterms
  - fecha
  - mes
  - dia
  - codigo_cliente

sum_columns:
  - despacho_t

# ─────────────────────────────────────────────────────────────────────
# LOOKUPS VIVOS (equivalente VLOOKUP del Excel)
# ─────────────────────────────────────────────────────────────────────
lookups:
  cartera:
    table: int_cartera
    description: |
      codigo_cliente -> nombre_cliente, vendedor, tipo_venta (proxy
      desde canal_distribucion_desc hasta que negocio confirme fuente
      canónica), attribute_10 (para doble lookup canal).

  almacen:
    table: int_ref_almacen
    description: Doble lookup canal via cartera.attribute_10.

  semana:
    table: int_ref_semana
    description: dia (1-31) -> "SEMANA N".

# ─────────────────────────────────────────────────────────────────────
# DEFAULTS cuando un lookup no matchea
# ─────────────────────────────────────────────────────────────────────
defaults:
  nombre_cliente: Prospecto
  vendedor:       Prospecto
  tipo_venta:     VENTA DIRECTA
  canal:          OTROS
  semana2:        SEMANA 0

# ─────────────────────────────────────────────────────────────────────
# REGLAS POST-LOOKUP (macros VBA portadas)
# ─────────────────────────────────────────────────────────────────────

# Macro EliminarFilasDespacho:
# Drop filas donde TODAS estas cols están vacías o cero.
cleanup_empty_rows:
  enabled: true
  columns:
    - codigo_cliente
    - rf
    - despacho_t
    - rf_ajustado_im

# Macro EliminarRFajustado:
# Si día < día_actual AND proyección >= 0 -> resetear rf_ajustado_im.
reset_rf_ajustado_past_days:
  enabled: true
  target_col:     rf_ajustado_im
  proyeccion_col: proyeccion
  dia_col:        dia

# ─────────────────────────────────────────────────────────────────────
# NOTAS / PENDIENTES (a confirmar con negocio)
# ─────────────────────────────────────────────────────────────────────
notes: |
  - rf / rf_ajustado_im / proyeccion: quedan NULL hasta confirmar fuente
    (PROYECCION-SEMANAL.xlsx, entrada manual, etc.).
    Una vez definido, agregar un Stage previo al INT LOAD que cargue
    estos campos por (codigo_cliente, fecha) o la llave que aplique.

  - tipo_venta usa canal_distribucion_desc de int_cartera como PROXY.
    Cuando negocio defina la fuente canonica (hoja TipoVenta en
    Referencias.xlsx o tabla seed int_ref_tipo_venta), reemplazar el
    lookup en despacho_mes_normalize._lookup_cartera.

  - canal usa el doble VLOOKUP cartera.attribute_10 -> int_ref_almacen.
    Si negocio reporta que la ruta es distinta, ajustar el use case.

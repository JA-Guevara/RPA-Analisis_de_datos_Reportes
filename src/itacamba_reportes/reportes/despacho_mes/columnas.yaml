# ═════════════════════════════════════════════════════════════════════
# CATÁLOGO DE COLUMNAS — DESPACHO MES
# ═════════════════════════════════════════════════════════════════════
# Los 5 VLOOKUP vivos de la hoja DESPACHO_MES (cols P-T del basepanel),
# antes en despacho_mes_normalize.py, ahora declarativos.
# Se ejecutan DESPUÉS de la agregación (agregacion.py) y ANTES de las
# reglas VBA portadas (reglas.py). Orden = orden de este archivo.
# Ops del motor: ver transforms/column_engine.py.
# ═════════════════════════════════════════════════════════════════════

report: despacho_mes

columns:

  # Normalización de tipos (el normalize anterior casteaba ambas)
  codigo_cliente:
    op: copy
    from: codigo_cliente
    cast: int64

  dia:
    op: copy
    from: dia
    cast: int64

  # P: NOMBRE CLIENTE = VLOOKUP(K, CARTERA, 2, 0) con IFERROR "Prospecto"
  nombre_cliente:
    op: lookup
    table: int_cartera
    key: codigo_cliente
    ref_key: cliente
    returns: nombre_cliente
    cast_key: int64
    default: Prospecto

  # Q: VENDEDOR = VLOOKUP(K, CARTERA, 33, 0) con IFERROR "Prospecto"
  vendedor:
    op: lookup
    table: int_cartera
    key: codigo_cliente
    ref_key: cliente
    returns: vendedor
    cast_key: int64
    default: Prospecto

  # R: TIPO DE VENTA = VLOOKUP(K, REFERENCIAS!I:J, 2, 0) — PROXY:
  # REFERENCIAS!I:J no existe en Referencias.xlsx; se usa
  # cartera.canal_distribucion_desc hasta que negocio defina fuente
  # canónica (pendiente de calibración contra basepanel).
  tipo_venta:
    op: lookup
    table: int_cartera
    key: codigo_cliente
    ref_key: cliente
    returns: canal_distribucion_desc
    cast_key: int64
    default: VENTA DIRECTA

  # Insumo del doble lookup canal
  _attr10:
    op: lookup
    table: int_cartera
    key: codigo_cliente
    ref_key: cliente
    returns: attribute_10
    cast_key: int64

  # S: CANAL = doble VLOOKUP cartera.attribute_10 -> almacen.canal
  canal:
    op: lookup
    table: int_ref_almacen
    key: _attr10
    ref_key: descripcion_sap
    returns: canal
    default: OTROS

  # T: SEMANA2 = VLOOKUP(dia, REFERENCIAS!U:V, 2, 0)
  semana2:
    op: lookup
    table: int_ref_semana
    key: dia
    ref_key: dia
    returns: semana
    cast_key: int64
    default: SEMANA 0

# Portada técnica del reporte (validada por tools/verificar.py — Fase 7)
reporte: query
version: 1

entrada:
  tipo: excel
  archivo: QUERY*.xlsx
  carpeta: dinamicos
  hoja: base
  header_row: 1
  nota: el raw actual trae 49 columnas (el layout viejo tenia 57)

salidas:
  stg: stg_query          # copia fiel SIN filtro de mes (la consume gd20)
  int: int_query          # filtrado al mes objetivo (insumo de despacho_bi)

dependencias: []          # primer eslabon de la cadena despachos

modo_carga:
  stg: truncate_insert
  int: truncate_insert

llave_natural:
  - documento_venta
  - material
  - dia_natural

consumidores:
  - despacho_bi           # lee int_query
  - gd20_ventas_bi        # lee stg_query (CD/ZE)

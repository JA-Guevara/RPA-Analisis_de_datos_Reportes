# ═════════════════════════════════════════════════════════════════════
# CATÁLOGO DE COLUMNAS — DESPACHO BI
# ═════════════════════════════════════════════════════════════════════
# Las "fórmulas" del cliente (basepanel.xlsm, hoja QUERY cols AU:BG,
# pegadas como valores en DESPACHOS BI) declaradas como datos.
#
# Para AGREGAR una columna: añadir un bloque acá (se ejecutan en orden)
#   + una línea Column en persistence/models/int/despacho_bi_model.py
#   + migración alembic (--autogenerate la detecta).
# Para MODIFICAR una fórmula: editar su bloque y recalibrar con
#   tools/calibracion/ (simular → diff → confirmar paridad).
#
# Operaciones (transforms/column_engine.py — deliberadamente acotadas):
#   copy    {from, cast?}                    copia de otra columna
#   const   {value}                          literal
#   concat  {cols, sep?}                     concatena, NA -> ""
#   lookup  {table, key, ref_key, returns,   VLOOKUP contra tabla int_*
#            default?, default_from?,        · cast_key: int64 empareja como enteros
#            cast_key?, norm_keys?}          · norm_keys: strip | upper_strip
#           (key = col del df; ref_key = col de la tabla — no usar 'on',
#            YAML lo interpreta como booleano)
#   branch  {if: {col, contains|str_len_lte}, then: <op>, else: <op>}
#
# Columnas que empiezan con "_" son intermedias (se descartan al final).
# ═════════════════════════════════════════════════════════════════════

report: despacho_bi

columns:

  # ── CODIGO CLIENTE (fórmula AZ) ─────────────────────────────────────
  # IF(LEN(destinatario)<=5, VLOOKUP(centro_receptor, REF!H:I, 2),
  #    destinatario_mcia)
  # Destinatarios cortos son centros SAP (agencias): se traducen a
  # código de cliente vía int_ref_centro.
  _dest_int:
    op: copy
    from: destinatario_mcia
    cast: int64

  codigo_cliente:
    op: branch
    if: {col: _dest_int, str_len_lte: 5}
    then:
      op: lookup
      table: int_ref_centro
      key: centro_receptor
      ref_key: centro
      returns: codigo_sap_cliente
      norm_keys: strip
    else:
      op: copy
      from: _dest_int
    cast: int64

  # ── Lookups a CARTERA CATASTRO (int_cartera) ────────────────────────
  nombre_cliente:
    op: lookup
    table: int_cartera
    key: codigo_cliente
    ref_key: cliente
    returns: nombre_cliente
    cast_key: int64
    default: Prospecto

  # Fórmula AX VENDEDOR = VLOOKUP(codigo_cliente, CARTERA col 33)
  vendedor_cartera:
    op: lookup
    table: int_cartera
    key: codigo_cliente
    ref_key: cliente
    returns: vendedor
    cast_key: int64
    default: "0"

  _attr10:                       # insumo del doble lookup canal
    op: lookup
    table: int_cartera
    key: codigo_cliente
    ref_key: cliente
    returns: attribute_10
    cast_key: int64

  _grupo_vendedores:             # insumo del lookup equipo (rama no-CEMENTO)
    op: lookup
    table: int_cartera
    key: codigo_cliente
    ref_key: cliente
    returns: grupo_vendedores
    cast_key: int64

  # ── DESARROLLADOR (fórmula AY) ──────────────────────────────────────
  # VLOOKUP(vendedor, REFERENCIAS!O:S, 3 = 'VENDEDOR OK')
  desarrollador:
    op: lookup
    table: int_ref_equipo
    key: vendedor_cartera
    ref_key: vendedor_sap
    returns: vendedor_ok
    default: No encontrado

  # ── EQUIPO (fórmula BA, condicional al producto) ────────────────────
  # IF(producto contiene "CEMENTO",
  #    VLOOKUP(vendedor, REF!O:S, 4),          ← por vendedor
  #    VLOOKUP(grupo_vendedores, REF!N:S, 5))  ← por grupo
  equipo:
    op: branch
    if: {col: producto, contains: CEMENTO}
    then:
      op: lookup
      table: int_ref_equipo
      key: vendedor_cartera
      ref_key: vendedor_sap
      returns: equipo
      default: No encontrado
    else:
      op: lookup
      table: int_ref_equipo
      key: _grupo_vendedores
      ref_key: grupo_vendedores
      returns: equipo
      default: No encontrado

  # ── CANAL (doble lookup, alimenta DESPACHO_MES) ─────────────────────
  # cartera.attribute_10 -> int_ref_almacen.descripcion_sap -> canal
  canal:
    op: lookup
    table: int_ref_almacen
    key: _attr10
    ref_key: descripcion_sap
    returns: canal
    default: OTROS

  # ── GERENCIA (fórmula BC) = VLOOKUP(equipo, REF!R:S, 2) ─────────────
  gerencia:
    op: lookup
    table: int_ref_equipo
    key: equipo
    ref_key: equipo
    returns: gerencia
    default: OTROS

  # ── LOCALIDAD IM (fórmula BB) = VLOOKUP(localidad, REF!A:B, 2) ──────
  # Match case-insensitive; sin match conserva la localidad original.
  localidad_im:
    op: lookup
    table: int_ref_localidad
    key: localidad
    ref_key: localidad_despacho
    returns: localidad_im
    norm_keys: upper_strip
    default_from: localidad

  # ── SEMANA (fórmula BD) = VLOOKUP(dia, REF!U:V, 2) ──────────────────
  # "SEMANA 1..5" del MES (hoja Semanas de REFERENCIAS.xlsx).
  # NO usar semana_anio: dio "SEMANA 18..21" (descalibración 2026-07).
  semana:
    op: lookup
    table: int_ref_semana
    key: dia
    ref_key: dia
    returns: semana
    cast_key: int64

  # ── Espejos / concatenaciones ───────────────────────────────────────
  x:                             # espejo de dia (col BD/x del cliente)
    op: copy
    from: dia
    cast: int64

  # INCOTERMS IM (fórmula BA') = incoterms & centro_distribucion
  # SIN espacio (ej. "FOBCD GUARACACHI") — pendiente confirmar contra
  # libro cliente si lleva espacio.
  incoterms_im:
    op: concat
    cols: [incoterms, centro_distribucion]

  # link = llave de cruce con PROYECCION (col AN del cliente)
  link:
    op: concat
    cols: [codigo_cliente, grupo_producto, departamento, producto,
           centro_distribucion]

# CARTERA — Catastro de clientes SAP (Itacamba)
# Una sola fuente de configuracion: source / normalize / mapping / rules.

dataset: cartera
description: Catastro de clientes SAP — VCBO Cadastro de Clientes (Itacamba)

# 1) SOURCE

source:
  file_pattern: CARTERA*.xlsx
  subdir: dinamicos
  sheet: Q_VCBO_ZSDI_I03_CAD_CLIENTE_000
  header_row: 6
  metadata_rows_to_skip: 0

# 2) NORMALIZE

rename_by_position:
  1:  Column2
  8:  Column9
  10: Column11
  11: Teléfono
  22: Column23
  24: Column25
  26: Column27
  28: Column29
  30: Equipo
  32: Vendedor
  33: Coordinador Ventas
  34: Coordinador
  36: Canal

dtypes:
  Cliente:        Int64
  Contador:       Int64
  Inclusion date:
    type: datetime
    dayfirst: true

sap_tokens:
  null_marker: "#"
  unassigned:
    - "Sin asignar"
    - "Not assigned"

transforms:
  - column: Column9
    op: uppercase
  - column: Column9
    op: replace
    map:
      POTOSÍ: POTOSI
      BO/PT:  POTOSI


# ---------------------------------------------------------------------------
# 3) MAPPING — rename a snake_case (sin drop: conservamos las 5 descripciones SAP)
# ---------------------------------------------------------------------------

to_int_model:
  rename:
    Cliente:                cliente
    Column2:                nombre_cliente
    Attribute 10:           attribute_10
    Población:              poblacion
    Barrio:                 barrio
    Attribute 7:            attribute_7
    Attribute 6:            attribute_6
    Región:                 region
    Column9:                region_nombre
    Grupo de cuentas:       grupo_cuentas
    Column11:               grupo_cuentas_desc
    Teléfono:               telefono
    N.I.F 1:                nit
    Código postal:          codigo_postal
    "GCD: CódEmplazFiscal": gcd_cod_emplaz_fiscal
    Calle:                  calle
    Inclusion date:         fecha_inclusion
    Tipo de operación:      tipo_operacion
    ZEMAILADD:              zemailadd
    ZVCRISK:                zvcrisk
    Vía de pago:            via_pago
    Sector:                 sector
    Column23:               sector_desc
    Canal Distribución:     canal_distribucion
    Column25:               canal_distribucion_desc
    Organización de Ventas: organizacion_ventas
    Column27:               organizacion_ventas_desc
    Oficina de Ventas:      oficina_ventas
    Column29:               oficina_ventas_desc
    Grupo de vendedores:    grupo_vendedores
    Equipo:                 equipo
    Representante ventas:   representante_ventas
    Vendedor:               vendedor
    Coordinador Ventas:     coordinador_ventas
    Coordinador:            coordinador
    Trilha:                 trilha
    Canal:                  canal
    Condición pago:         condicion_pago
    Contador:               contador

  drop: []

output_contract: itacamba_reportes.contracts.cartera_schema.CarteraIntContract

load:
  table: int_cartera
  mode: upsert
  unique_key: [cliente, sector, organizacion_ventas, oficina_ventas]


# ---------------------------------------------------------------------------
# 4) RULES
# ---------------------------------------------------------------------------

lookups:
  donaciones:
    description: Clientes con tratamiento de donacion.
    last_updated: "2026-04-27"
    items:
      - cliente_nombre: "Cliente Donaciones"
        label_canal: DONACION
      - cliente_nombre: "DONACIONES DTM"
        label_canal: DONACION
      - cliente_nombre: "CLIENTE GENERICO SIN FACTURA"
        label_canal: DONACION
      - cliente_nombre: "DONACIONES COMERCIAL"
        label_canal: DONACION

  regiones_validas:
    description: Codigos de region Bolivia validos.
    items: [SC, LP, CB, PT, BE, OR, TJ, CH, PA, 'EX', 'FL', 'LX']

rules:
  # Replica fiel del VBA ModificarDonaciones: para clientes target,
  # si vendedor/coordinador esta en "Sin asignar"/"Not assigned" -> "DONACION"
  - name: apply_donations_classification
    config: lookups.donaciones
    target_columns: [vendedor, coordinador]

  - name: validate_region_from_lookup
    config: lookups.regiones_validas
    target_columns: [region]
